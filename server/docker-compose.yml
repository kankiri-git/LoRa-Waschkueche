# Server-Seite fuer die Waschkueche: MQTT-Broker, Datenbank, Dashboard und Fertig-Meldung.
# Einrichten: ./einrichten.sh (legt .env mit zufaelligen Passwoertern und die MQTT-Benutzer an), dann
#   docker compose up -d
# Grafana: http://<Server>:3000 (Benutzer admin, Passwort GRAFANA_PASS aus .env), Dashboard "Waschküche".
name: waschkueche

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: waschkueche-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"          # das Gateway (C6L am Fenster) verbindet sich hierher
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-daten:/mosquitto/data

  influxdb:
    image: influxdb:2.9
    container_name: waschkueche-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"          # Oberflaeche der Datenbank (optional)
    volumes:
      - influxdb-daten:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASS}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
      - DOCKER_INFLUXDB_INIT_ORG=home
      - DOCKER_INFLUXDB_INIT_BUCKET=waschkueche
      - DOCKER_INFLUXDB_INIT_RETENTION=0       # 0 = unbegrenzt aufheben

  telegraf:
    image: telegraf:1.40
    container_name: waschkueche-telegraf
    restart: unless-stopped
    depends_on: [mosquitto, influxdb]
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - MQTT_PASS_TELEGRAF=${MQTT_PASS_TELEGRAF}

  grafana:
    image: grafana/grafana:13.2.5
    container_name: waschkueche-grafana
    restart: unless-stopped
    depends_on: [influxdb]
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-daten:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=${TZ:-Europe/Berlin}
      - INFLUX_TOKEN=${INFLUX_TOKEN}

  fertigmeldung:
    build: ./fertigmeldung
    image: waschkueche/fertigmeldung:local
    container_name: waschkueche-fertigmeldung
    restart: unless-stopped
    depends_on: [mosquitto]
    volumes:
      - fertigmeldung-daten:/data
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - MQTT_HOST=mosquitto
      - MQTT_USER=fertigmeldung
      - MQTT_PASS=${MQTT_PASS_FERTIGMELDUNG}
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      # Schwellen nachstellen (Vorgaben in fertigmeldung.py), zum Beispiel:
      # - WASCHMASCHINE_STILL_MIN=8
      # - TROCKNER_ARBEIT_W=80

volumes:
  mosquitto-daten:
  influxdb-daten:
  influxdb-config:
  grafana-daten:
  fertigmeldung-daten:
