# Telegraf: Werte des Gateways aus MQTT in die InfluxDB (Bucket waschkueche).

[agent]
  interval = "10s"
  flush_interval = "10s"
  omit_hostname = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "home"
  bucket = "waschkueche"

# waschkueche: je empfangener Sendung sensors/waschkueche/waschmaschine und .../trockner: power (W), energy (Wh,
# Zaehlerstand des Shelly Plug PM), online (false = Sender erreicht den Shelly nicht). Solange eine Maschine laeuft
# alle 30 s, sonst alle 5 min. Die Maschine steht als Tag "maschine" dabei.
# Die Themen sind exakte Treffer: .../status (Text), .../diag, .../vibration, .../einstellungen, .../fertig und
# .../zustand/... landen nicht hier.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/waschkueche/waschmaschine", "sensors/waschkueche/trockner"]
  qos = 0
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  data_format = "json"
  json_string_fields = ["online"]   # gelistete Booleans bleiben Boolean-Felder
  name_override = "waschkueche"
  topic_tag = ""
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sensors/waschkueche/+"
    tags = "_/_/maschine"

# waschkueche_funk: Zustand der Funkstrecke, jede Minute und nach jeder Sendung. alter_s = Sekunden seit der
# letzten Sendung aus der Waschkueche (-1: seit dem Start des Gateways keine), rssi/snr = Empfang am Gateway,
# quittung_rssi/quittung_snr = Empfang der Quittung am Sender, verloren = Sendungen ohne Quittung seit Start
# des Senders, empfangen/doppelt/ungueltig/crc_fehler/luecken/veraltet = Zaehler des Gateways seit seinem Start,
# sender_laufzeit_s, gw_laufzeit_s, wlan_rssi, fcnt, fw, einst_ok, einst_gesendet, sensor_an, sensor_da.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/waschkueche/diag"]
  qos = 0
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  data_format = "json"
  json_string_fields = ["fw"]
  name_override = "waschkueche_funk"
  topic_tag = ""

# waschkueche_vibration: Kennzahlen des Beschleunigungssensors (optional, M5Stack Unit Accel am Sender), je
# Sendung mit Sensor, Werte in mg: rms, rms_max, spitze, dreh_hz / dreh_upm / dreh, b0..b11 (Frequenzbaender),
# lage_x/y/z (Erdbeschleunigung in g), rahmen, ok, verworfen, fehler. Ohne Sensor kommt nichts.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/waschkueche/vibration"]
  qos = 0
  username = "telegraf"
  password = "${MQTT_PASS_TELEGRAF}"
  data_format = "json"
  name_override = "waschkueche_vibration"
  topic_tag = ""
